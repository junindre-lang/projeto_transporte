<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>cadastro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth/cadastro.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/shared/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth/acesso.css') }}">
</head>
<body>
    <main class="auth-page">
        <section class="auth-card" aria-labelledby="titulo-cadastro">
            <a class="auth-brand" href="{{ url_for('inicial') }}">EXPRESSO FEDERAL</a>
            <header class="auth-header"><h1 id="titulo-cadastro">Criar conta</h1><p>Preencha os dados abaixo para se cadastrar.</p></header>
            <form action="/cadastrar" method="post" class="auth-form">
                <div class="auth-field"><label for="nome">Nome</label><input type="text" id="nome" name="nome" placeholder="Digite seu nome" required autocomplete="name"></div>
                <div class="auth-field"><label for="email">E-mail</label><input type="email" id="email" name="email" placeholder="Digite seu e-mail" required autocomplete="email"></div>
                <div class="auth-field"><label for="matri">Matrícula</label><input type="text" id="matri" name="matri" placeholder="Digite sua matrícula" required autocomplete="username"></div>
                <div class="auth-field"><label for="sen">Senha</label><input type="password" id="sen" name="sen" placeholder="Crie uma senha" required autocomplete="new-password"></div>
                <div class="auth-field"><label for="sen1">Confirmar senha</label><input type="password" id="sen1" name="sen1" placeholder="Confirme sua senha" required autocomplete="new-password"></div>
                <button type="submit" class="auth-submit">Cadastrar</button>
                {% if msg %}<p class="auth-alert" role="alert">{{ msg }}</p>{% endif %}
            </form>
            <nav class="auth-links" aria-label="Opções de acesso"><p>Você já tem uma conta? <a href="/logarlink">Entrar</a></p><a class="auth-back" href="{{ url_for('inicial') }}">← Voltar para a página principal</a></nav>
        </section>
    </main>
</body>
</html>
