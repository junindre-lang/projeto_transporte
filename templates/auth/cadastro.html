<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>cadastro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth/cadastro.css') }}">
</head>
<body>
    <div class="topo">
        {{msg}}

        <h1>EXPRESSO FEDERAL</h1>
    </div>
    <div class="dados">
        <form action="/cadastrar" method="post">
            <h2>CADASTRO</h2><br>
            <input type="text" placeholder="digite seu nome:" name="nome"><br><br>
            <input type="text" placeholder="digite seu email:" name="email"><br><br>
            <input type="text" placeholder="digite a sua matricula:" name="matri"><br><br>
            <input type="text" placeholder="crie sua senha:" name="sen"><br><br>
            <input type="password" placeholder="confirme a senha:" name="sen1"><br><br>
            <button type="submit">cadastrar</button><br><br>
            <a>você já tem uma conta?</a>
            <a href="/logar">entrar</a>
        </form>
    </div>

</body>
</html>
