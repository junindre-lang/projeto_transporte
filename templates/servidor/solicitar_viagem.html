<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expresso Federal - Solicitar Viagem</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/servidor/solicitar_viagem.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/shared/base.css') }}">
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-brand">
            <h1>EXPRESSO</h1>
        </div>

        {% include 'includes/servidor_nav.html' %}
    </div>

    <div class="main-content">

        <div class="main-header">
            <div class="header-title">
                <h2>SOLICITAR NOVA VIAGEM</h2>
            </div>
            <div class="header-subtitle">
                <span>Preencha os dados abaixo para enviar à aprovação</span>
            </div>
        </div>

        <hr class="linha-divisoria">

        <div class="content-card">
            {% with mensagens = get_flashed_messages(with_categories=true) %}
                {% for categoria, mensagem in mensagens %}
                <p class="mensagem-{{ categoria }}" role="alert">{{ mensagem }}</p>
                {% endfor %}
            {% endwith %}
            <form action="/cad_viagem" method="POST" class="form-expresso">

                <div class="form-group">
                    <label for="motorista_id"><i class="fa-solid fa-user-tie"></i> Motorista</label>
                    <select id="motorista_id" name="motorista_id" required>
                        <option value="" selected disabled>Selecione um motorista</option>
                        {% for motorista in motoristas %}
                            <option value="{{ motorista.id }}">{{ motorista.nome }} — {{ motorista.status }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="rota"><i class="fa-solid fa-map-location-dot"></i> Destino / Rota</label>
                    <input type="text" id="rota" name="rota" placeholder="Ex: Campus Sousa para Campus Cajazeiras" required>
                </div>

                <div class="form-group">
                    <label for="data_horario"><i class="fa-solid fa-calendar-clock"></i> Data e Horário de Partida</label>
                    <input type="datetime-local" id="data_horario" name="data_horario" required>
                </div>

                <div class="form-group">
                    <label for="veiculo"><i class="fa-solid fa-car"></i> Veículo disponível</label>
                    <select id="veiculo" name="veiculo" required>
                        <option value="" selected disabled>Selecione um veículo</option>
                        {% for veiculo in veiculos %}
                            <option value="{{ veiculo.prefixo }}">{{ veiculo.prefixo }} — {{ veiculo.modelo }}</option>
                        {% else %}
                            <option value="" disabled>Nenhum veículo disponível</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-principal de-lado">
                        <i class="fa-solid fa-check"></i> Enviar Solicitação
                    </button>
                    <a href="/list_viagem_servidores" class="btn-secundario">Cancelar</a>
                </div>

            </form>
        </div>

    </div>

    <script src="{{ url_for('static', filename='js/servidor/solicitar_viagem.js') }}"></script>
</body>
</html>
