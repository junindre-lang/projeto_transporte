<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Expresso Federal - Solicitar Viagem</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/servidor/solicitar_viagem.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-brand">
            <h1>EXPRESSO</h1>
        </div>

        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Buscar no menu...">
        </div>

        <ul class="sidebar-menu">
            <li>
                <a href="/list_viagem_servidores"><i class="fa-solid fa-house"></i> INÍCIO</a>
            </li>
            <li>
                <a href="/rotas_servidor"><i class="fa-solid fa-route"></i> ROTAS</a>
            </li>
            <li>
                <a href="/transito_serv"><i class="fa-solid fa-car-side"></i> TRÂNSITO</a>
            </li>
            <li>
                <a href="/cad_viagem" class="active"><i class="fa-solid fa-paper-plane"></i> SOLICITAR VIAGEM</a>
            </li>
            <li>
                <a href="/list_viagem_servidores"><i class="fa-solid fa-bus"></i> MINHAS VIAGENS</a>
            </li>

        </ul>

        <div class="sidebar-footer">
            <a href="/logarlink" class="logout-btn"><i class="fa-solid fa-power-off"></i> SAIR</a>
        </div>
    </div>

    <div class="main-content">

        <div class="main-header">
            <div class="header-title">
                <h2>SOLICITAR NOVA VIAGEM</h2>
            </div>
            <div class="header-subtitle">
                <span>Preencha os dados abaixo para enviar à aprovação</span>
            </div>
        </div>

        <hr class="linha-divisoria">

        <div class="content-card">
            <form action="/cad_viagem" method="POST" class="form-expresso">

                <div class="form-group">
                    <label for="motorista_nome"><i class="fa-solid fa-user-tie"></i> Nome do Motorista</label>
                    <input type="text" id="motorista_nome" name="motorista_nome" placeholder="Ex: João Silva" required>
                </div>

                <div class="form-group">
                    <label for="rota"><i class="fa-solid fa-map-location-dot"></i> Destino / Rota</label>
                    <input type="text" id="rota" name="rota" placeholder="Ex: Campus Sousa para Campus Cajazeiras" required>
                </div>

                <div class="form-group">
                    <label for="data_horario"><i class="fa-solid fa-calendar-clock"></i> Data e Horário de Partida</label>
                    <input type="datetime-local" id="data_horario" name="data_horario" required>
                </div>

                <div class="form-group">
                    <label for="veiculo"><i class="fa-solid fa-car"></i> Modelo do Veículo</label>
                    <input type="text" id="veiculo" name="veiculo" placeholder="Ex: Van Oficial - Placa ABC-1234" required>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-principal de-lado">
                        <i class="fa-solid fa-check"></i> Enviar Solicitação
                    </button>
                    <a href="/list_viagem_servidores" class="btn-secundario">Cancelar</a>
                </div>

            </form>
        </div>

    </div>

    <script src="{{ url_for('static', filename='js/servidor/solicitar_viagem.js') }}"></script>
</body>
</html>
