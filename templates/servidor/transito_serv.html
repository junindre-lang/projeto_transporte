<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoramento de Viagens - Expresso Federal</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/shared/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/shared/transito.css') }}">
</head>
<body class="pagina-transito">
    <aside id="sidebar" class="transito-sidebar">
        <a href="javascript:history.back()" class="botao transito-back">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8"/>
            </svg>
            Voltar
        </a>

        <h2>Monitoramento de Frota</h2>

        <section id="status-conexao" class="status-card">
            <h3>Status do Monitoramento</h3>
            <p class="status-value" id="transporte-status" aria-live="polite">Buscando viagens ativas...</p>
        </section>

        <section class="status-card">
            <h3>Última Sincronização</h3>
            <p class="status-value" id="transporte-atualizacao">--:--:--</p>
        </section>

        <section class="status-card">
            <h3>Dados do Veículo Ativo</h3>
            <div class="vehicle-details">
                <p><strong>Motorista:</strong> <span id="info-motorista">Nenhum</span></p>
                <p><strong>Veículo:</strong> <span id="info-veiculo">--</span></p>
                <p><strong>Rota:</strong> <span id="info-rota">--</span></p>
                <p><strong>Velocidade:</strong> <span id="info-velocidade">0 km/h</span></p>
            </div>
        </section>
    </aside>

    <main id="map" aria-label="Mapa de monitoramento da frota"></main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="{{ url_for('static', filename='js/admin/transito.js') }}"></script>
    <script src="{{ url_for('static', filename='js/shared/sidebar.js') }}"></script>
</body>
</html>
