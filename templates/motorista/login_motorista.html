<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Motorista - Sistema de Transporte</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/motorista/login_motorista.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/shared/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth/acesso.css') }}">
</head>
<body>

    <main class="auth-page">
        <section class="auth-card" aria-labelledby="titulo-login-motorista">
            <a class="auth-brand" href="{{ url_for('inicial') }}">EXPRESSO FEDERAL</a>
            <header class="auth-header"><h1 id="titulo-login-motorista">Acesso do motorista</h1><p>Entre para acessar o painel de viagens.</p></header>
            <form action="/motorista" method="POST" class="auth-form">
                <div class="auth-field"><label for="identificador">CPF ou matrícula</label><input type="text" id="identificador" name="identificador" placeholder="000.000.000-00" required autocomplete="username"></div>
                <div class="auth-field"><label for="senha">Senha</label><input type="password" id="senha" name="senha" placeholder="Digite sua senha" required autocomplete="current-password"></div>
                <button type="submit" class="auth-submit">Entrar</button>
                {% if msg %}<p class="auth-alert" role="alert">{{ msg }}</p>{% endif %}
            </form>
            <a class="auth-back" href="{{ url_for('inicial') }}">← Voltar para a página principal</a>
        </section>
    </main>
</body>
</html>
