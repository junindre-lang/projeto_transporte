<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoramento de Viagens - Expresso Federal</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/shared/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/shared/transito.css') }}">
</head>
<body class="pagina-transito">

    <aside id="sidebar" class="sidebar transito-sidebar">
        <div class="sidebar-brand"><h1>EXPRESSO</h1></div>
        {% include 'includes/admin_links.html' %}
        <h2>Monitoramento de Frota</h2>

        <section id="status-conexao" class="status-card">
            <h3>Status do Monitoramento</h3>
            <p class="status-value" id="transporte-status" aria-live="polite">Buscando viagens ativas...</p>
        </section>

        <section class="status-card">
            <h3>Última Sincronização</h3>
            <p class="status-value" id="transporte-atualizacao">--:--:--</p>
        </section>

        <section class="status-card">
            <h3>Dados do Veículo Ativo</h3>
            <p class="vehicle-details">
                <span><strong>Motorista:</strong> <span id="info-motorista">Nenhum</span></span>
                <span><strong>Veículo:</strong> <span id="info-veiculo">--</span></span>
                <span><strong>Rota:</strong> <span id="info-rota">--</span></span>
                <span><strong>Velocidade:</strong> <span id="info-velocidade">0 km/h</span></span>
            </p>
        </section>
        {% include 'includes/admin_logout.html' %}
    </aside>

    <main id="map" aria-label="Mapa de monitoramento da frota"></main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="{{ url_for('static', filename='js/admin/transito.js') }}"></script>
</body>
</html>
