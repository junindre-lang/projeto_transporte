<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoramento de Viagens - Sistema de Transporte</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <link rel="stylesheet" href="{{ url_for('static', filename='css/shared/transito.css') }}">
</head>
<body>

    <div id="sidebar">
        <h2>Monitoramento de Frota</h2>

        <div id="status-conexao" class="status-card">
            <h3>Status do Monitoramento</h3>
            <div class="status-value" id="transporte-status">Buscando viagens ativas...</div>
        </div>

        <div class="status-card connected" style="border-left-color: #38bdf8;">
            <h3>Última Sincronização</h3>
            <div class="status-value" id="transporte-atualizacao">--:--:--</div>
        </div>

        <div class="status-card connected" style="border-left-color: #eab308;">
            <h3>Dados do Veículo Ativo</h3>
            <p style="font-size: 0.9rem; margin-top: 5px; color: #cbd5e1; line-height: 1.5rem;">
                <strong>Motorista:</strong> <span id="info-motorista">Nenhum</span><br>
                <strong>Veículo:</strong> <span id="info-veiculo">--</span><br>
                <strong>Rota:</strong> <span id="info-rota">--</span><br>
                <strong>Velocidade:</strong> <span id="info-velocidade">0 km/h</span>
            </p>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="{{ url_for('static', filename='js/admin/transito.js') }}"></script>
</body>
</html>
